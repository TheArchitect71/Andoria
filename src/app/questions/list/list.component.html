<section aria-label="Journey questions">
  <a
    class="question-link"
    *ngFor="let question of state.questions; trackBy: trackQuestion"
    [routerLink]="['/answer', question.id]"
    [queryParams]="{ journey: journeyPath }"
  >
    <mat-card>
      <mat-card-content>{{ question.title }}</mat-card-content>
    </mat-card>
  </a>

  <div #loadTrigger class="load-trigger" aria-hidden="true"></div>

  <div class="load-status" *ngIf="state.isLoading" role="status">
    <mat-spinner [diameter]="32"></mat-spinner>
    <span>Loading questions…</span>
  </div>

  <div class="load-status" *ngIf="state.error" role="alert">
    <p>{{ state.error }}</p>
    <button mat-stroked-button (click)="loadMore()">Try again</button>
  </div>

  <div class="load-status" *ngIf="!supportsObserver && state.hasMore && !state.isLoading && !state.error">
    <button mat-stroked-button (click)="loadMore()">Load more questions</button>
  </div>

  <p class="end-message" *ngIf="!state.hasMore && !state.error" role="status">
    {{ state.questions.length ? 'You have reached the end!' : 'No questions found for this journey.' }}
  </p>
</section>
